<!DOCTYPE html>
<html>
<head>
  <title>Navora AI Test Frontend</title>
</head>
<body>
  <h1>Navora AI Travel Planner</h1>

  <h2>Create Trip</h2>
  <input id="title" placeholder="Title" value="LA Trip">
  <input id="destination_city" placeholder="Destination City" value="Los Angeles">
  <input id="departure_city" placeholder="Departure City" value="Dallas">
  <input id="arrival_date" type="date" value="2026-06-01">
  <input id="departure_date" type="date" value="2026-06-05">
  <input id="traveler_type" placeholder="Traveler Type" value="normal">
  <input id="budget" type="number" value="2000">

  <label>
    Has Car
    <input id="has_car" type="checkbox" checked>
  </label>

  <label>
    Need Hotel
    <input id="need_hotel" type="checkbox" checked>
  </label>

  <label>
    Need Flight
    <input id="need_flight" type="checkbox" checked>
  </label>

  <button onclick="createTrip()">Create Trip</button>

  <hr>

  <h2>Actions</h2>
  <input id="trip_id" placeholder="Trip ID">
  <button onclick="generateAIItinerary()">Generate AI Itinerary</button>
  <button onclick="getTripDetail()">Get Trip Detail</button>
  <button onclick="getTripHistory()">Get Trip History</button>

  <p id="loading"></p>

  <hr>

  <h2>Trip Detail</h2>
  <div id="tripDetail"></div>

  <hr>

  <h2>Raw Output</h2>
  <pre id="output"></pre>

  <script src="script.js"></script>
</body>
</html>
